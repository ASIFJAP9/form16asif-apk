name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Form16 TDS" com.form16.tds --web-dir=www
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          if [ -f icon-512.png ]; then
            R=android/app/src/main/res
            rm -rf $R/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; s=${d##*:}; mkdir -p $R/mipmap-$n
              for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
                convert icon-512.png -resize ${s}x${s} $R/mipmap-$n/$f.png
              done
            done
          fi
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Form16-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
